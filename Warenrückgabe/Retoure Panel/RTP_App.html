<!DOCTYPE html>
<html lang="de">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retoure Panel</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,<?= appIcon ?>">
  <?!= include("RTP_Styles"); ?>
</head>
<body>
  <div id="loadBar" class="loadbar on"><span></span></div>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img class="brand-mark" alt="Retoure Panel" src="data:image/svg+xml;base64,<?= appIcon ?>">
        <div class="brand-text">
          <span class="brand-title">Retoure Panel</span>
          <span class="brand-ver">v<?= appVersion ?></span>
        </div>
        <button id="sideToggle" class="side-toggle" type="button" title="Seitenleiste einklappen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot">
        <div id="userLine" class="user-badge"></div>
        <a id="sheetLink" class="muted small" href="#" target="_blank" rel="noopener">Sheet öffnen</a>
        <p class="footnote">
          <span>Part of Warehouse Management System</span>
          <span>by Arasaka</span>
        </p>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div class="top-title">
          <h1 id="viewTitle">Übersicht</h1>
          <div id="viewSub" class="top-sub"></div>
        </div>
        <div class="top-actions">
          <button id="btnRueckTop" class="top-btn green" type="button" title="R-Nummern manuell auf Grün (Rücksendung) setzen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
            <span class="top-btn-label">Rücksendung</span>
          </button>
          <div class="btn-split">
            <button id="btnMailScan" class="top-btn blue" type="button" title="Alfah Retoure-Mails jetzt lesen">
              <svg class="scan-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <span class="top-btn-label">Mails scannen</span>
            </button>
            <button id="btnMailCfg" class="top-btn blue cfg" type="button" title="Mail-Scan Verbindung / Postfach">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
          <div id="liveChip" class="live-chip loading">
            <span class="dot"></span>
            <span id="loadedAt">Lade Daten…</span>
          </div>
          <button id="btnRefresh" class="refresh" type="button" title="Jetzt aktualisieren">
            <svg class="refresh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 13a8 8 0 0 0 14.6 4.5"/><path d="M4 4v4.5h4.5M20 20v-4.5h-4.5"/></svg>
            <span class="refresh-label">Aktualisieren</span>
          </button>
        </div>
      </header>
      <section id="view" class="view">
        <div class="loading">Lade Daten…</div>
      </section>
    </main>
  </div>
  <div id="drawerBack" class="drawer-back hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <div class="drawer-head-main">
        <div id="drawerTitle" class="drawer-title"></div>
        <div id="drawerSub" class="muted small"></div>
      </div>
      <button id="drawerClose" class="btn ghost icon" type="button">✕</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>
  <datalist id="dlSuppliers"></datalist>
  <datalist id="dlBrands"></datalist>
  <datalist id="dlWorkers"></datalist>
  <div id="toasts" class="toasts"></div>
  <?!= include("RTP_Script"); ?>
</body>
</html>
