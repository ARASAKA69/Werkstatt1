<style>
  :root {
    --bg: #070a13;
    --bg-deep: #05070e;
    --panel: rgba(15, 20, 36, 0.74);
    --panel-solid: #0f1526;
    --panel2: rgba(23, 31, 54, 0.78);
    --panel3: rgba(32, 43, 74, 0.62);
    --border: rgba(148, 163, 218, 0.14);
    --border-strong: rgba(148, 163, 218, 0.26);
    --text: #e6ecff;
    --text-bright: #f8faff;
    --muted: #8b98be;
    --blue: #5ea1ff;
    --cyan: #38bdf8;
    --indigo: #818cf8;
    --violet: #a78bfa;
    --pink: #e879a8;
    --green: #34d399;
    --orange: #fb923c;
    --yellow: #fbbf24;
    --red: #f87171;
    --purple: #c084fc;
    --gemini-grad: linear-gradient(135deg, #38bdf8 0%, #818cf8 52%, #e879a8 100%);
    --gemini-soft: linear-gradient(135deg, rgba(56,189,248,.18) 0%, rgba(129,140,248,.18) 52%, rgba(232,121,168,.16) 100%);
    --glow-blue: 0 0 24px rgba(94, 161, 255, 0.24);
    --glow-gemini: 0 8px 28px rgba(99, 102, 241, 0.28), 0 0 18px rgba(56, 189, 248, 0.18);
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    color-scheme: dark;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(129, 140, 248, 0.22); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 248, 0.4); }
  a { color: var(--cyan); text-decoration: none; transition: color .15s ease; }
  a:hover { color: #93ddff; text-decoration: none; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  .ambient-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(680px 420px at 8% -6%, rgba(56, 189, 248, 0.15), transparent 65%),
      radial-gradient(640px 460px at 94% 4%, rgba(168, 85, 247, 0.15), transparent 65%),
      radial-gradient(760px 520px at 52% 108%, rgba(99, 102, 241, 0.12), transparent 68%),
      linear-gradient(180deg, #070a14 0%, #060912 100%);
  }

  .app { position: relative; z-index: 1; display: flex; height: 100vh; overflow: hidden; }

  .side {
    width: 248px;
    flex: 0 0 248px;
    background: linear-gradient(180deg, rgba(13, 18, 34, 0.86), rgba(9, 13, 25, 0.92));
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-right: 1px solid var(--border);
    box-shadow: 8px 0 36px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    transition: width .2s cubic-bezier(.2,.8,.2,1), flex-basis .2s cubic-bezier(.2,.8,.2,1);
  }
  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 18px 16px 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .brand::after {
    content: "";
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, rgba(56,189,248,.5), rgba(168,85,247,.45), transparent);
  }
  .brand-logo-wrap {
    position: relative;
    flex: 0 0 auto;
    border-radius: 13px;
    padding: 1px;
    background: var(--gemini-grad);
    box-shadow: 0 0 22px rgba(99, 102, 241, 0.35);
  }
  .brand-mark { width: 38px; height: 38px; border-radius: 12px; display: block; }
  .brand-text { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; flex: 1; }
  .brand-title {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.01em;
    white-space: nowrap;
    background: linear-gradient(95deg, #ffffff 15%, #b9d4ff 60%, #e5b8ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-ver {
    align-self: flex-start;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #b7c5ec;
    background: rgba(129, 140, 248, 0.12);
    border: 1px solid rgba(129, 140, 248, 0.28);
    border-radius: 99px;
    padding: 1px 8px;
  }
  .side-toggle {
    margin-left: auto;
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: rgba(23, 31, 54, 0.7);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all .16s ease;
  }
  .side-toggle:hover {
    color: var(--text-bright);
    border-color: rgba(129, 140, 248, 0.55);
    box-shadow: 0 0 14px rgba(129, 140, 248, 0.28);
  }
  .side-toggle svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }

  .nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-group {
    color: #6d7ba3;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    padding: 14px 12px 6px;
  }
  .nav-item {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    margin-bottom: 3px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: transparent;
    color: #c5d0ee;
    cursor: pointer;
    text-align: left;
    font: inherit;
    font-weight: 500;
    transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .nav-item:hover {
    background: rgba(129, 140, 248, 0.09);
    color: var(--text-bright);
    border-color: rgba(129, 140, 248, 0.16);
  }
  .nav-item.active {
    background: var(--gemini-soft);
    border-color: rgba(129, 140, 248, 0.42);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: -1px;
    top: 7px;
    bottom: 7px;
    width: 3px;
    border-radius: 4px;
    background: var(--gemini-grad);
    box-shadow: 0 0 10px rgba(94, 161, 255, 0.8);
  }
  .nav-ico { width: 15px; height: 15px; flex: 0 0 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: #8ab4ff; }
  .nav-item.active .nav-ico { color: #67e8f9; filter: drop-shadow(0 0 6px rgba(56,189,248,.65)); }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .dot-alfah { background: #60a5fa; box-shadow: 0 0 9px rgba(96,165,250,.75); }
  .dot-geliefert { background: #34d399; box-shadow: 0 0 9px rgba(52,211,153,.75); }
  .dot-abgelehnt { background: #f87171; box-shadow: 0 0 9px rgba(248,113,113,.75); }
  .dot-wm { background: #2dd4bf; box-shadow: 0 0 9px rgba(45,212,191,.7); }
  .dot-aag { background: #818cf8; box-shadow: 0 0 9px rgba(129,140,248,.75); }
  .dot-sta { background: #c084fc; box-shadow: 0 0 9px rgba(192,132,252,.75); }
  .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-short { display: none; }
  .nav-count {
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: rgba(15, 22, 42, 0.78);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 1px 8px;
    color: var(--muted);
    white-space: nowrap;
  }
  .nav-item.active .nav-count { border-color: rgba(129, 140, 248, 0.38); color: #dbe6ff; background: rgba(15, 22, 42, 0.9); }
  .nav-count.ready {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(52, 211, 153, 0.5);
    color: #6ee7b7;
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.25);
  }

  @media (min-width: 1101px) {
    body.side-collapsed .side { width: 68px; flex-basis: 68px; }
    body.side-collapsed .brand { flex-direction: column; gap: 10px; padding: 14px 0; }
    body.side-collapsed .brand-text, body.side-collapsed .nav-group, body.side-collapsed .nav-label, body.side-collapsed .nav-count, body.side-collapsed .nav-dot, body.side-collapsed .nav-ico, body.side-collapsed .side-foot { display: none; }
    body.side-collapsed .side-toggle { margin-left: 0; }
    body.side-collapsed .side-toggle svg { transform: rotate(180deg); }
    body.side-collapsed .nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
    body.side-collapsed .nav-item { justify-content: center; padding: 10px 0; }
    body.side-collapsed .nav-short { display: inline; font-size: 11px; font-weight: 700; letter-spacing: .05em; }
  }

  .side-foot {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(7, 10, 20, 0.45);
  }
  .sheet-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    transition: color .15s ease;
  }
  .sheet-link svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sheet-link:hover { color: var(--cyan); }
  .user-badge {
    display: inline-block;
    align-self: flex-start;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(94, 161, 255, 0.12);
    color: #9ec5ff;
    border: 1px solid rgba(94, 161, 255, 0.32);
  }
  .user-badge:empty { display: none; }
  .footnote {
    margin: 2px 0 0;
    align-self: stretch;
    padding: 7px 10px;
    border: 1px solid rgba(129, 140, 248, 0.24);
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(56,189,248,.07), rgba(168,85,247,.08));
    color: #b7c4ea;
    font-size: 9.5px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: .02em;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .footnote span:last-child { color: #c084fc; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .top {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 26px;
    border-bottom: 1px solid var(--border);
    background: rgba(10, 14, 27, 0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 5;
  }
  .top::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, rgba(56,189,248,.7), rgba(129,140,248,.65) 40%, rgba(232,121,168,.5) 72%, transparent 96%);
    box-shadow: 0 0 16px rgba(129, 140, 248, 0.45);
  }
  .top-title { min-width: 0; }
  .top h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.02em;
    background: linear-gradient(92deg, #ffffff 25%, #c7dcff 75%, #e9c3ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .top-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .top-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 36px;
    padding: 0 15px;
    border-radius: 99px;
    border: 1px solid var(--border-strong);
    background: rgba(20, 28, 50, 0.75);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all .16s ease;
  }
  .top-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .top-btn.green {
    border-color: rgba(52, 211, 153, 0.42);
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(6, 95, 70, 0.22));
    color: #6ee7b7;
    box-shadow: 0 0 18px rgba(16, 185, 129, 0.16);
  }
  .top-btn.green:hover {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.32));
    border-color: rgba(52, 211, 153, 0.75);
    color: #ecfdf5;
    box-shadow: 0 0 24px rgba(52, 211, 153, 0.34);
    transform: translateY(-1px);
  }
  .top-btn:disabled { opacity: .55; cursor: default; transform: none; }

  .live-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 15px;
    border-radius: 99px;
    background: rgba(17, 24, 44, 0.8);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: #d5e0ff;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    backdrop-filter: blur(10px);
  }
  .live-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); position: relative; }
  .live-chip.live { border-color: rgba(52, 211, 153, 0.36); box-shadow: 0 0 16px rgba(52, 211, 153, 0.12); }
  .live-chip.live .dot { background: var(--green); box-shadow: 0 0 10px rgba(52, 211, 153, 0.8); animation: rtpPulse 2.2s infinite; }
  .live-chip.cache { border-color: rgba(251, 191, 36, 0.4); }
  .live-chip.cache .dot { background: var(--yellow); box-shadow: 0 0 8px rgba(251, 191, 36, 0.7); }
  .live-chip.loading { border-color: rgba(129, 140, 248, 0.5); }
  .live-chip.loading .dot { background: var(--indigo); animation: rtpPulseG 1.1s infinite; }
  @keyframes rtpPulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.65); } 70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }
  @keyframes rtpPulseG { 0% { box-shadow: 0 0 0 0 rgba(129,140,248,.7); } 70% { box-shadow: 0 0 0 8px rgba(129,140,248,0); } 100% { box-shadow: 0 0 0 0 rgba(129,140,248,0); } }

  .refresh {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 18px 0 14px;
    border-radius: 99px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    cursor: pointer;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #3b82f6 0%, #6366f1 52%, #a855f7 100%);
    box-shadow: var(--glow-gemini);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .refresh:hover {
    filter: brightness(1.1);
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45), 0 0 22px rgba(56, 189, 248, 0.32);
    transform: translateY(-1px);
  }
  .refresh:active { transform: translateY(0); }
  .refresh:disabled { cursor: default; filter: saturate(.65); transform: none; }
  .refresh-ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .refresh.loading .refresh-ico { animation: rtpSpin .8s linear infinite; }
  .refresh.loading .refresh-label::after { content: "…"; }

  .stock-badge, .rnum-badge, .part-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 7px;
    font: 600 12px/1.5 "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: .02em;
    cursor: copy;
    white-space: nowrap;
    transition: all .14s ease;
  }
  .stock-badge svg, .rnum-badge svg, .part-badge svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
  .stock-badge {
    border: 1px solid rgba(56, 189, 248, 0.38);
    background: rgba(56, 189, 248, 0.11);
    color: #7dd3fc;
  }
  .stock-badge:hover {
    background: rgba(56, 189, 248, 0.22);
    border-color: var(--cyan);
    color: #fff;
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
  }
  .rnum-badge {
    border: 1px solid rgba(167, 139, 250, 0.42);
    background: rgba(139, 92, 246, 0.14);
    color: #ddd6fe;
  }
  .rnum-badge:hover {
    background: rgba(139, 92, 246, 0.28);
    border-color: var(--violet);
    color: #fff;
    box-shadow: 0 0 14px rgba(167, 139, 250, 0.34);
  }
  .part-badge {
    border: 1px solid rgba(148, 163, 218, 0.26);
    background: rgba(148, 163, 218, 0.09);
    color: #dbe4ff;
    font-size: 11.5px;
  }
  .part-badge:hover {
    background: rgba(148, 163, 218, 0.2);
    border-color: rgba(165, 180, 252, 0.55);
    color: #fff;
  }
  .stock-badge:hover svg, .rnum-badge:hover svg, .part-badge:hover svg { opacity: 1; }
  .stock-badge.copied, .rnum-badge.copied, .part-badge.copied {
    background: rgba(16, 185, 129, 0.24);
    border-color: var(--green);
    color: #bbf7d0;
    box-shadow: 0 0 16px rgba(52, 211, 153, 0.35);
  }
  .stock-badge.lg, .rnum-badge.lg { font-size: 14.5px; padding: 4px 12px; border-radius: 9px; }
  .stock-badge.lg svg, .rnum-badge.lg svg { width: 13px; height: 13px; }
  .stock-badge.sm, .rnum-badge.sm { font-size: 11px; padding: 0 6px; margin-left: 4px; text-transform: none; }

  .ext-links { display: inline-flex; gap: 5px; align-items: center; }
  .ext-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid rgba(94, 161, 255, 0.36);
    background: rgba(94, 161, 255, 0.11);
    color: #93c5fd;
    text-decoration: none !important;
    white-space: nowrap;
    transition: all .14s ease;
  }
  .ext-pill:hover {
    background: rgba(94, 161, 255, 0.25);
    border-color: var(--blue);
    color: #fff;
    box-shadow: 0 0 12px rgba(94, 161, 255, 0.3);
  }
  .ext-pill.mail {
    border-color: rgba(232, 121, 168, 0.42);
    background: rgba(232, 121, 168, 0.13);
    color: #f9a8d4;
  }
  .ext-pill.mail:hover {
    background: rgba(232, 121, 168, 0.28);
    border-color: var(--pink);
    color: #fff;
    box-shadow: 0 0 12px rgba(232, 121, 168, 0.34);
  }

  .rt-chk {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 1.5px solid rgba(148, 163, 218, 0.34);
    background: rgba(8, 12, 24, 0.72);
    color: transparent;
    cursor: pointer;
    padding: 0;
    transition: all .14s ease;
  }
  .rt-chk svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .rt-chk:hover { border-color: var(--indigo); background: rgba(129, 140, 248, 0.16); box-shadow: 0 0 10px rgba(129, 140, 248, 0.28); }
  .rt-chk:active { transform: scale(.93); }
  .rt-chk.on {
    background: linear-gradient(135deg, #10b981, #059669);
    border-color: #34d399;
    color: #fff;
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.38);
  }
  .rt-chk.on.deliver {
    background: linear-gradient(135deg, #34d399, #059669);
    border-color: #6ee7b7;
    box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.22), 0 0 14px rgba(52, 211, 153, 0.45);
  }
  .rt-chk.busy { opacity: .55; pointer-events: none; animation: rtpPulseG .8s infinite; }
  td.chk-td, th.chk-th { text-align: center; width: 68px; }

  .view { flex: 1; overflow: auto; padding: 22px 26px 44px; container-type: inline-size; container-name: view; }
  .loading { padding: 48px; text-align: center; color: var(--muted); font-size: 13.5px; }

  .btn {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    border: 1px solid rgba(167, 139, 250, 0.45);
    border-radius: 10px;
    padding: 8px 15px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.28);
    transition: all .15s ease;
  }
  .btn:hover { filter: brightness(1.1); box-shadow: 0 6px 22px rgba(124, 58, 237, 0.42); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
